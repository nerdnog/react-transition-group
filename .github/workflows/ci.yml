name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  # Runs react-next from the Actions tab. GitHub turns the schedule off after
  # 60 days without activity in a public repo; a manual run turns it back on.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      # Otherwise how would we know if a specific React version caused the failure?
      fail-fast: false
      matrix:
        react: ['18', '19.0', '19']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: npm run lint
      - run: npm run testonly
      - run: npm run build
      - run: npm run check:layout
      - run: npm run smoke:prod
        if: startsWith(matrix.react, '19')

  # A failure here means a coming React release breaks the internal lookup,
  # before users see it.
  react-next:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save react@canary react-dom@canary
      - run: npm run testonly
      - run: npm run build
      - run: npm run check:layout
      - run: npm run smoke:prod
