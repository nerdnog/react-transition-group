name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    # A pre-release would otherwise publish to npm's `latest` tag.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint && npm run testonly
      - run: npm run build && npm run check:layout
      - name: Tag matches version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "v$(node -p "require('./lib/package.json').version")"
      # The built lib/ doesn't depend on the installed React.
      - name: Test on React 19
        run: npm install --no-save react@19 react-dom@19 && npm run testonly && npm run smoke:prod
      - run: npm publish ./lib --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
