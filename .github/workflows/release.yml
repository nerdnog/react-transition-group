name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint && npm run testonly
      - run: npm run build && npm run check:layout
      - name: Tag matches version
        run: test "${{ github.event.release.tag_name }}" = "v$(node -p "require('./lib/package.json').version")"
      - run: npm publish ./lib --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
